<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>pricewatch</title>
<style>
body{font:16px system-ui,sans-serif;max-width:960px;margin:2rem auto;padding:0 1rem;color:#1a1a1a}
input,select,button{font:inherit;padding:.5rem .7rem;border:1px solid #bbb;border-radius:8px}
button{background:#1a56db;color:#fff;border-color:#1a56db;cursor:pointer}button:disabled{opacity:.6}
.row{display:flex;gap:.5rem;flex-wrap:wrap;margin:.6rem 0}#q{flex:1;min-width:220px}
table{border-collapse:collapse;width:100%;margin-top:1rem}th,td{padding:.45rem .6rem;border-bottom:1px solid #e3e3e3;text-align:left}
th{background:#f5f5f5}.big{font-size:1.5rem;font-weight:700}.muted{color:#666;font-size:.9rem}.err{color:#b00020}
.no{color:#b00020}.yes{color:#0a7a2f}img{max-height:120px;border-radius:8px}
</style></head><body>
<h1>pricewatch</h1>
<p class="muted">Type a product name, upload a photo, or both. <a href="watchlist.html">Tracked watchlist</a></p>
<div class="row"><input id="q" placeholder="e.g. Levi's 511 slim fit jeans">
<select id="kind"><option>Anything</option><option>Clothing &amp; shoes</option></select>
<select id="gender"><option>Any</option><option>Men</option><option>Women</option></select></div>
<div class="row"><input type="file" id="photo" accept="image/*"><img id="prev" hidden alt="">
<button id="go">Find prices</button></div>
<div id="out" aria-live="polite"></div>
<script type="module">
import { Client, handle_file } from "https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js";
const SPACE = "Aman519/pricewatch";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const inr = n => "₹" + Math.round(n).toLocaleString("en-IN");
const pct = v => v == null ? "-" : (v >= 0 ? "+" : "") + v.toFixed(1) + "%";
let client;
$("photo").onchange = () => { const f = $("photo").files[0]; $("prev").hidden = !f; if (f) $("prev").src = URL.createObjectURL(f); };
$("q").onkeydown = e => { if (e.key === "Enter") $("go").click(); };
$("go").onclick = async () => {
  const q = $("q").value.trim(), f = $("photo").files[0], out = $("out");
  if (!q && !f) { out.innerHTML = '<p class="err">Type a product name or choose a photo.</p>'; return; }
  $("go").disabled = true; out.innerHTML = '<p class="muted">Searching stores… the first request can take up to a minute while the Space wakes up.</p>';
  try {
    client ||= await Client.connect(SPACE);
    const res = await client.predict("/find", [q, f ? handle_file(f) : null, $("kind").value, $("gender").value, 0.75]);
    render(res.data[0]);
  } catch (e) { out.innerHTML = '<p class="err">Could not reach the search service: ' + esc(e.message || e) + '</p>'; }
  $("go").disabled = false;
};
function render(d) {
  const out = $("out");
  if (!d.ok) { out.innerHTML = '<p class="err">' + esc(d.error) + '</p>'; return; }
  let h = '<p class="muted">Searched for: <b>' + esc(d.query) + '</b>' +
    (d.photo_info ? ' (guessed from your photo; add brand/model for a sharper result)' : '') + '</p>';
  (d.notes || []).forEach(n => h += '<p class="muted">' + esc(n) + '</p>');
  const s = d.summary;
  if (!s) { out.innerHTML = h + '<p>No matching listings (' + d.listings_found + ' found, all filtered out). Try a more general name.</p>'; return; }
  h += '<div class="big">Lowest: ' + inr(s.lowest.price) + ' at ' + esc(s.lowest.store) + '</div>' +
    '<p>Median ' + inr(s.median) + ' · average ' + inr(s.average) + ' · ' + s.store_count + ' stores</p>' +
    '<table><tr><th>Store</th><th>Price</th><th>vs lowest</th><th>vs median</th><th>Claims</th><th>MRP inflation</th><th>Looks same?</th><th></th></tr>';
  for (const r of s.stores) {
    const same = r.looks_same == null ? "-" : r.looks_same ? '<span class="yes">yes</span>' : '<span class="no">no</span>';
    h += '<tr><td>' + esc(r.store) + '</td><td>' + inr(r.price) + '</td><td>' + pct(r.markup_vs_lowest_pct) + '</td><td>' + pct(r.markup_vs_median_pct) +
      '</td><td>' + (r.claimed_discount_pct == null ? "-" : r.claimed_discount_pct.toFixed(0) + "% off") + '</td><td>' + pct(r.mrp_inflation_pct) +
      '</td><td>' + same + '</td><td>' + (/^https?:/.test(r.url || "") ? '<a href="' + esc(r.url) + '" target="_blank" rel="noopener">open</a>' : "") + '</td></tr>';
  }
  h += '</table><p class="muted">MRP inflation compares each store\'s struck-through price with today\'s median price.</p>';
  if (d.rejected && d.rejected.length) h += '<details><summary>' + d.rejected.length + ' listings filtered out</summary><ul>' +
    d.rejected.slice(0, 40).map(x => '<li>' + esc(x.store) + ': ' + esc(x.title) + ' — ' + esc(x.reason) + '</li>').join("") + '</ul></details>';
  out.innerHTML = h;
}
</script></body></html>
