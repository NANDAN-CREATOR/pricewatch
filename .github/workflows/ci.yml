name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["data/**", "site/trends.json"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest -r requirements.txt
      - run: playwright install --with-deps chromium
      - run: python -m pytest -q
      - name: Demo run (offline sample data)
        run: python -m pricewatch --source sample --history /tmp/h.jsonl --out /tmp/site.json
