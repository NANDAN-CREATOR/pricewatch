name: Update prices and deploy site

on:
  push:
    branches: [main]
    paths: ["site/**"]
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:
    inputs:
      demo:
        description: "Use the offline sample data instead of live stores"
        type: boolean
        default: false

permissions:
  contents: write   # commit history back to the repo
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Collect prices
        run: |
          if [ "${{ inputs.demo }}" = "true" ]; then
            python -m pricewatch --source sample
          else
            python -m pricewatch
          fi

      - name: Commit history and site data
        run: |
          git config user.name "pricewatch-bot"
          git config user.email "pricewatch-bot@users.noreply.github.com"
          git add data/history.jsonl site/site.json
          git diff --cached --quiet || git commit -m "chore: update prices [skip ci]"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
