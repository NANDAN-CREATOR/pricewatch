name: Sync to Hugging Face Space
on:
  push:
    branches: [main]
    paths: [app.py, "pricewatch/**", requirements-space.txt, .github/workflows/sync-to-hf.yml]
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install huggingface_hub
      - name: Upload app files to the Space (its README.md is left alone)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os, shutil
          from huggingface_hub import HfApi
          os.makedirs("space", exist_ok=True)
          shutil.copytree("pricewatch", "space/pricewatch", ignore=shutil.ignore_patterns("__pycache__"))
          shutil.copy("app.py", "space/app.py")
          shutil.copy("requirements-space.txt", "space/requirements.txt")
          HfApi(token=os.environ["HF_TOKEN"]).upload_folder(
              folder_path="space", repo_id="Aman519/pricewatch", repo_type="space",
              commit_message="Sync from GitHub " + os.environ.get("GITHUB_SHA", "")[:7])
          PY
